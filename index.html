<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PARA SONIA ✨ - Universo de Tulipanes</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #030108;
            color: #ffffff;
            user-select: none;
            -webkit-user-select: none;
        }

        #webgl-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .font-cursive {
            font-family: 'Dancing Script', cursive;
        }

        /* Glassmorphism Styling */
        .glass-panel {
            background: rgba(25, 12, 35, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 182, 217, 0.25);
            box-shadow: 0 8px 32px 0 rgba(236, 72, 153, 0.2);
        }

        .glass-button {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 192, 220, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-button:hover {
            background: rgba(236, 72, 153, 0.35);
            border-color: rgba(255, 255, 255, 0.6);
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 0 20px rgba(236, 72, 153, 0.5);
        }

        .glass-button:active {
            transform: translateY(0) scale(0.97);
        }

        /* Audio Visualizer Bar */
        .audio-bar {
            transition: height 0.08s ease;
        }
    </style>
</head>
<body class="relative w-full h-full">

    <!-- WebGL Canvas Container -->
    <div id="webgl-canvas"></div>

    <!-- UI Overlay Layer -->
    <div class="relative z-10 w-full h-full pointer-events-none flex flex-col justify-between p-4 sm:p-6 md:p-8">

        <!-- Top Header -->
        <header class="w-full flex justify-between items-center pointer-events-auto">
            <div class="glass-panel px-4 py-2 sm:px-6 sm:py-3 rounded-2xl flex items-center gap-3">
                <i class="fa-solid fa-spa text-pink-400 text-xl animate-spin" style="animation-duration: 12s;"></i>
                <div>
                    <h1 class="font-cursive text-2xl sm:text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-pink-300 via-rose-300 to-purple-300">
                        PARA SONIA ✨
                    </h1>
                    <p class="text-[10px] sm:text-xs text-pink-200/70 tracking-widest uppercase">Universo de Tulipanes</p>
                </div>
            </div>

            <!-- Controls Info / Hint -->
            <div class="hidden sm:flex items-center gap-2 glass-panel px-4 py-2 rounded-xl text-xs text-pink-200/80">
                <i class="fa-solid fa-hand-pointer text-pink-400"></i>
                <span>Haz clic para crear corazones | Arrastra para rotar</span>
            </div>
        </header>

        <!-- Center Card: Romantic Phrases Carousel -->
        <main class="w-full max-w-lg mx-auto pointer-events-auto my-auto">
            <div class="glass-panel rounded-3xl p-6 sm:p-8 text-center relative overflow-hidden transition-all duration-500 transform hover:scale-[1.01] border border-pink-300/30">
                <!-- Decorative background elements -->
                <div class="absolute -top-10 -left-10 w-32 h-32 bg-pink-500/20 rounded-full blur-2xl"></div>
                <div class="absolute -bottom-10 -right-10 w-32 h-32 bg-purple-500/20 rounded-full blur-2xl"></div>

                <div class="relative z-10">
                    <span class="inline-block px-3 py-1 rounded-full text-xs font-semibold bg-pink-500/20 text-pink-300 border border-pink-400/30 mb-4">
                        <i class="fa-solid fa-heart text-xs mr-1 text-pink-400"></i> Mensaje para Sonia (<span id="phrase-counter">1 / 6</span>)
                    </span>

                    <div class="min-h-[110px] flex items-center justify-center">
                        <p id="phrase-display" class="font-cursive text-2xl sm:text-3xl md:text-4xl text-pink-100 leading-relaxed transition-opacity duration-300 opacity-100">
                            "Como los tulipanes que florecen con elegancia, tu sonrisa ilumina cada rincón de mi universo."
                        </p>
                    </div>

                    <!-- Phrase Controls -->
                    <div class="flex items-center justify-between mt-6 pt-4 border-t border-pink-500/20">
                        <button id="prev-phrase" class="glass-button w-10 h-10 rounded-full flex items-center justify-center text-pink-200 hover:text-white" title="Anterior">
                            <i class="fa-solid fa-chevron-left"></i>
                        </button>
                        
                        <div class="flex gap-1.5" id="phrase-dots">
                            <!-- Dynamic Dots inserted via JS -->
                        </div>

                        <button id="next-phrase" class="glass-button w-10 h-10 rounded-full flex items-center justify-center text-pink-200 hover:text-white" title="Siguiente">
                            <i class="fa-solid fa-chevron-right"></i>
                        </button>
                    </div>
                </div>
            </div>
        </main>

        <!-- Bottom Controls: Audio Player & Interactive Quick Buttons -->
        <footer class="w-full max-w-xl mx-auto pointer-events-auto flex flex-col sm:flex-row items-center gap-3">
            <!-- Audio Player Glass Card -->
            <div class="glass-panel w-full p-3 sm:p-4 rounded-2xl flex items-center justify-between gap-3">
                <div class="flex items-center gap-3">
                    <button id="play-btn" class="glass-button w-12 h-12 rounded-xl flex items-center justify-center text-pink-300 hover:text-white text-lg flex-shrink-0">
                        <i class="fa-solid fa-play" id="play-icon"></i>
                    </button>
                    <div class="overflow-hidden">
                        <div class="text-xs font-semibold text-pink-200 truncate">Yellow - Coldplay 🎵</div>
                        <div class="text-[10px] text-pink-300/60 truncate">Playing: Yellow</div>
                    </div>
                </div>

                <!-- Visualizer Bars -->
                <div class="flex items-end gap-1 h-8 px-2" id="visualizer-container">
                    <div class="audio-bar w-1 bg-pink-400/60 rounded-full h-2"></div>
                    <div class="audio-bar w-1 bg-pink-400/80 rounded-full h-4"></div>
                    <div class="audio-bar w-1 bg-rose-400 rounded-full h-6"></div>
                    <div class="audio-bar w-1 bg-pink-300 rounded-full h-3"></div>
                    <div class="audio-bar w-1 bg-purple-400 rounded-full h-5"></div>
                </div>

                <!-- Volume Control -->
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-volume-high text-pink-300/70 text-xs"></i>
                    <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8" 
                           class="w-16 sm:w-20 accent-pink-400 h-1 bg-pink-950/50 rounded-lg appearance-none cursor-pointer">
                </div>
            </div>

            <!-- Burst Hearts Action Button -->
            <button id="burst-hearts-btn" class="glass-button w-full sm:w-auto px-5 py-3 rounded-2xl flex items-center justify-center gap-2 text-sm font-medium text-pink-200 hover:text-white whitespace-nowrap">
                <i class="fa-solid fa-heart-pulse text-pink-400 text-base"></i>
                <span>¡Lluvia de Amor!</span>
            </button>
        </footer>

    </div>

    <!-- AUDIO ELEMENT POINTING TO yellow.mp3 -->
    <audio id="bg-music" src="yellow.mp3" loop preload="auto"></audio>

    <script>
        /* =========================================================================
           1. PHRASES DATA & CAROUSEL LOGIC
           ========================================================================= */
        const romanticPhrases = [
            "Como los tulipanes que florecen con elegancia, tu sonrisa ilumina cada rincón de mi universo, Sonia.",
            "En esta galaxia infinita de estrellas, tú eres la flor más deslumbrante y viva.",
            "Cada pétalo de estos tulipanes rosa y magenta lleva guardado un 'te quiero' para ti.",
            "Eres el centro de gravedad de mis mejores pensamientos.",
            "Yellow suena de fondo porque el mundo entero brilla con un tono hermoso cuando estás cerca.",
            "Un ramo eterno de tulipanes digitales para la persona más maravillosa: Sonia."
        ];

        let currentPhraseIndex = 0;
        const phraseDisplay = document.getElementById('phrase-display');
        const phraseCounter = document.getElementById('phrase-counter');
        const dotsContainer = document.getElementById('phrase-dots');

        // Create Navigation Dots
        romanticPhrases.forEach((_, idx) => {
            const dot = document.createElement('div');
            dot.className = `w-2 h-2 rounded-full transition-all duration-300 ${idx === 0 ? 'bg-pink-400 w-5' : 'bg-pink-400/30'}`;
            dotsContainer.appendChild(dot);
        });

        function updatePhrase(index) {
            currentPhraseIndex = index;
            phraseDisplay.style.opacity = '0';
            
            setTimeout(() => {
                phraseDisplay.textContent = `"${romanticPhrases[currentPhraseIndex]}"`;
                phraseCounter.textContent = `${currentPhraseIndex + 1} / ${romanticPhrases.length}`;
                phraseDisplay.style.opacity = '1';

                // Update Dots
                Array.from(dotsContainer.children).forEach((dot, idx) => {
                    if (idx === currentPhraseIndex) {
                        dot.className = 'w-5 h-2 bg-pink-400 rounded-full transition-all duration-300';
                    } else {
                        dot.className = 'w-2 h-2 bg-pink-400/30 rounded-full transition-all duration-300';
                    }
                });
            }, 300);
        }

        document.getElementById('next-phrase').addEventListener('click', () => {
            const nextIdx = (currentPhraseIndex + 1) % romanticPhrases.length;
            updatePhrase(nextIdx);
        });

        document.getElementById('prev-phrase').addEventListener('click', () => {
            const prevIdx = (currentPhraseIndex - 1 + romanticPhrases.length) % romanticPhrases.length;
            updatePhrase(prevIdx);
        });

        // Auto-rotate phrases every 8 seconds
        setInterval(() => {
            const nextIdx = (currentPhraseIndex + 1) % romanticPhrases.length;
            updatePhrase(nextIdx);
        }, 8000);


        /* =========================================================================
           2. AUDIO PLAYER LOGIC
           ========================================================================= */
        const audio = document.getElementById('bg-music');
        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        const volumeSlider = document.getElementById('volume-slider');
        const visualizerBars = document.querySelectorAll('.audio-bar');
        let isPlaying = false;

        audio.volume = volumeSlider.value;

        playBtn.addEventListener('click', () => {
            if (isPlaying) {
                audio.pause();
                playIcon.className = 'fa-solid fa-play';
                isPlaying = false;
            } else {
                audio.play().then(() => {
                    playIcon.className = 'fa-solid fa-pause';
                    isPlaying = true;
                }).catch(err => {
                    console.log("Audio file loading or interaction required:", err);
                });
            }
        });

        volumeSlider.addEventListener('input', (e) => {
            audio.volume = e.target.value;
        });

        // Simulated audio visualizer animation when music plays
        setInterval(() => {
            if (isPlaying) {
                visualizerBars.forEach(bar => {
                    const randomHeight = Math.floor(Math.random() * 24) + 6;
                    bar.style.height = `${randomHeight}px`;
                });
            } else {
                visualizerBars.forEach(bar => bar.style.height = '6px');
            }
        }, 100);


        /* =========================================================================
           3. THREE.JS 3D SCENE SETUP
           ========================================================================= */
        const container = document.getElementById('webgl-canvas');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030108, 0.012);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 12, 28);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        // OrbitControls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 60;
        controls.minDistance = 8;
        controls.maxPolarAngle = Math.PI / 2 + 0.1;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.6;

        /* Lighting Setup */
        const ambientLight = new THREE.AmbientLight(0xffd1dc, 0.8);
        scene.add(ambientLight);

        const coreLight = new THREE.PointLight(0xff69b4, 3, 40);
        coreLight.position.set(0, 2, 0);
        scene.add(coreLight);

        const dirLight = new THREE.DirectionalLight(0xffe4e1, 1.2);
        dirLight.position.set(10, 20, 15);
        scene.add(dirLight);

        const purpleLight = new THREE.PointLight(0x8a2be2, 2, 50);
        purpleLight.position.set(-15, 10, -15);
        scene.add(purpleLight);


        /* =========================================================================
           4. PROCEDURAL 3D TULIP CREATION (Pink, Magenta, Violet, Soft Cream)
           ========================================================================= */
        const tulipColors = [
            0xffb6c1, // Light Pink
            0xe60073, // Magenta / Deep Pink
            0xda70d6, // Orchid / Soft Violet
            0xffe4e1, // Misty Rose / Soft Cream
            0xff69b4  // Hot Pink
        ];

        function createTulipMesh(colorHex) {
            const tulipGroup = new THREE.Group();

            // 1. Stem (Curved slender green tube)
            const stemCurve = new THREE.CatmullRomCurve3([
                new THREE.Vector3(0, 0, 0),
                new THREE.Vector3(Math.random() * 0.2 - 0.1, 1.5, Math.random() * 0.2 - 0.1),
                new THREE.Vector3(0, 3.2, 0)
            ]);
            const stemGeo = new THREE.TubeGeometry(stemCurve, 16, 0.08, 8, false);
            const stemMat = new THREE.MeshStandardMaterial({
                color: 0x556b2f,
                roughness: 0.6,
                metalness: 0.1
            });
            const stemMesh = new THREE.Mesh(stemGeo, stemMat);
            tulipGroup.add(stemMesh);

            // 2. Leaves (Gracefully curved tulip leaves)
            const leafShape = new THREE.Shape();
            leafShape.moveTo(0, 0);
            leafShape.quadraticCurveTo(0.3, 1.2, 0.1, 2.5);
            leafShape.quadraticCurveTo(-0.2, 1.2, 0, 0);

            const leafGeo = new THREE.ShapeGeometry(leafShape);
            const leafMat = new THREE.MeshStandardMaterial({
                color: 0x6b8e23,
                side: THREE.DoubleSide,
                roughness: 0.5
            });

            for (let l = 0; l < 2; l++) {
                const leaf = new THREE.Mesh(leafGeo, leafMat);
                leaf.position.set(0, 0.5 + l * 0.4, 0);
                leaf.rotation.y = (l * Math.PI) + (Math.random() * 0.4 - 0.2);
                leaf.rotation.z = -0.3 + (l * 0.1);
                leaf.scale.set(0.8, 1, 0.8);
                tulipGroup.add(leaf);
            }

            // 3. Tulip Flower Head (Layered petals cup)
            const headGroup = new THREE.Group();
            headGroup.position.set(0, 3.2, 0);

            const petalShape = new THREE.Shape();
            petalShape.moveTo(0, 0);
            petalShape.bezierCurveTo(0.4, 0.3, 0.6, 1.2, 0.4, 1.8);
            petalShape.bezierCurveTo(0.2, 2.2, -0.2, 2.2, -0.4, 1.8);
            petalShape.bezierCurveTo(-0.6, 1.2, -0.4, 0.3, 0, 0);

            const petalGeo = new THREE.ShapeGeometry(petalShape);
            
            const petalMat = new THREE.MeshPhysicalMaterial({
                color: colorHex,
                emissive: colorHex,
                emissiveIntensity: 0.15,
                roughness: 0.3,
                metalness: 0.05,
                clearcoat: 0.3,
                side: THREE.DoubleSide,
                transmission: 0.2,
                opacity: 0.95,
                transparent: true
            });

            // Outer layer: 3 petals curved inward
            for (let i = 0; i < 3; i++) {
                const petal = new THREE.Mesh(petalGeo, petalMat);
                const angle = (i * Math.PI * 2) / 3;
                
                petal.rotation.y = angle;
                petal.rotation.x = -0.25;
                petal.position.x = Math.sin(angle) * 0.15;
                petal.position.z = Math.cos(angle) * 0.15;
                headGroup.add(petal);
            }

            // Inner layer: 3 overlapping petals closed tight
            for (let i = 0; i < 3; i++) {
                const petal = new THREE.Mesh(petalGeo, petalMat);
                const angle = (i * Math.PI * 2) / 3 + (Math.PI / 3);
                
                petal.rotation.y = angle;
                petal.rotation.x = -0.15;
                petal.position.x = Math.sin(angle) * 0.1;
                petal.position.z = Math.cos(angle) * 0.1;
                petal.scale.set(0.9, 0.95, 0.9);
                headGroup.add(petal);
            }

            // Inner core glow
            const coreGeo = new THREE.SphereGeometry(0.18, 8, 8);
            const coreMat = new THREE.MeshBasicMaterial({ color: 0xfff8dc });
            const coreMesh = new THREE.Mesh(coreGeo, coreMat);
            coreMesh.position.y = 0.5;
            headGroup.add(coreMesh);

            tulipGroup.add(headGroup);

            return tulipGroup;
        }

        const tulipsCluster = new THREE.Group();
        scene.add(tulipsCluster);

        const numTulips = 120;
        const tulipsData = [];

        for (let i = 0; i < numTulips; i++) {
            const color = tulipColors[Math.floor(Math.random() * tulipColors.length)];
            const tulip = createTulipMesh(color);

            let x, y, z, scale;

            if (i < 30) {
                // Central dense bouquet
                const radius = Math.random() * 4.5 + 0.5;
                const angle = Math.random() * Math.PI * 2;
                x = Math.cos(angle) * radius;
                z = Math.sin(angle) * radius;
                y = (Math.random() - 0.5) * 2;
                scale = Math.random() * 0.4 + 0.8;
            } else {
                // Outer spiral arms
                const distance = Math.random() * 22 + 5;
                const arms = 3;
                const armAngle = ((i % arms) * (Math.PI * 2)) / arms;
                const spiralAngle = distance * 0.35;
                const totalAngle = armAngle + spiralAngle;

                x = Math.cos(totalAngle) * distance + (Math.random() - 0.5) * 2;
                z = Math.sin(totalAngle) * distance + (Math.random() - 0.5) * 2;
                y = (Math.random() - 0.5) * 4;
                scale = Math.random() * 0.5 + 0.5;
            }

            tulip.position.set(x, y, z);
            tulip.scale.set(scale, scale, scale);

            tulip.rotation.x = (Math.random() - 0.5) * 0.5;
            tulip.rotation.z = (Math.random() - 0.5) * 0.5;
            tulip.rotation.y = Math.random() * Math.PI * 2;

            tulipsCluster.add(tulip);

            tulipsData.push({
                mesh: tulip,
                baseY: y,
                speed: Math.random() * 0.002 + 0.001,
                rotSpeed: (Math.random() - 0.5) * 0.005,
                phase: Math.random() * Math.PI * 2
            });
        }


        /* =========================================================================
           5. COSMIC GALAXY PARTICLES (STARS & METEORS)
           ========================================================================= */
        const starsCount = 4500;
        const starGeometry = new THREE.BufferGeometry();
        const starPositions = new Float32Array(starsCount * 3);
        const starColors = new Float32Array(starsCount * 3);

        const palette = [
            new THREE.Color(0xffb6c1), // Pink
            new THREE.Color(0xda70d6), // Violet
            new THREE.Color(0xff69b4), // Hot pink
            new THREE.Color(0xffe4b5), // Soft Gold
            new THREE.Color(0xffffff)  // White
        ];

        for (let i = 0; i < starsCount; i++) {
            const r = Math.pow(Math.random(), 2) * 40 + 0.5;
            const theta = Math.random() * Math.PI * 2;
            const phi = (Math.random() - 0.5) * 0.3;

            starPositions[i * 3] = r * Math.cos(theta);
            starPositions[i * 3 + 1] = r * Math.sin(phi) * 1.5;
            starPositions[i * 3 + 2] = r * Math.sin(theta);

            const col = palette[Math.floor(Math.random() * palette.length)];
            starColors[i * 3] = col.r;
            starColors[i * 3 + 1] = col.g;
            starColors[i * 3 + 2] = col.b;
        }

        starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        starGeometry.setAttribute('color', new THREE.BufferAttribute(starColors, 3));

        function createSparkleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(0.3, 'rgba(255,182,193,0.8)');
            grad.addColorStop(0.8, 'rgba(236,72,153,0.2)');
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 64, 64);

            const texture = new THREE.Texture(canvas);
            texture.needsUpdate = true;
            return texture;
        }

        const starMaterial = new THREE.PointsMaterial({
            size: 0.45,
            vertexColors: true,
            map: createSparkleTexture(),
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const starField = new THREE.Points(starGeometry, starMaterial);
        scene.add(starField);

        // Shooting Stars (Meteors)
        const meteors = [];
        const meteorGeo = new THREE.BufferGeometry();
        const meteorPositions = new Float32Array(2 * 3); // Head & Tail
        meteorGeo.setAttribute('position', new THREE.BufferAttribute(meteorPositions, 3));
        
        const meteorMat = new THREE.LineBasicMaterial({
            color: 0xffb6c1,
            transparent: true,
            opacity: 0.8
        });

        function createMeteor() {
            const line = new THREE.Line(meteorGeo.clone(), meteorMat);
            scene.add(line);
            
            const startX = (Math.random() - 0.5) * 60;
            const startY = Math.random() * 20 + 10;
            const startZ = (Math.random() - 0.5) * 60;

            meteors.push({
                line: line,
                pos: new THREE.Vector3(startX, startY, startZ),
                vel: new THREE.Vector3(-0.6, -0.4, -0.6),
                life: 1.0
            });
        }

        setInterval(() => {
            if (Math.random() < 0.6) createMeteor();
        }, 2000);


        /* =========================================================================
           6. INTERACTIVE FLOATING HEARTS SYSTEM
           ========================================================================= */
        const heartsGroup = new THREE.Group();
        scene.add(heartsGroup);
        const activeHearts = [];

        function createHeartGeometry() {
            const shape = new THREE.Shape();
            const x = 0, y = 0;
            shape.moveTo(x + 0.25, y + 0.25);
            shape.bezierCurveTo(x + 0.25, y + 0.25, x + 0.2, y, x, y);
            shape.bezierCurveTo(x - 0.3, y, x - 0.3, y + 0.35, x - 0.3, y + 0.35);
            shape.bezierCurveTo(x - 0.3, y + 0.55, x - 0.1, y + 0.77, x + 0.25, y + 0.95);
            shape.bezierCurveTo(x + 0.6, y + 0.77, x + 0.8, y + 0.55, x + 0.8, y + 0.35);
            shape.bezierCurveTo(x + 0.8, y + 0.35, x + 0.8, y, x + 0.5, y);
            shape.bezierCurveTo(x + 0.35, y, x + 0.25, y + 0.25, x + 0.25, y + 0.25);

            const extrudeSettings = {
                depth: 0.1,
                bevelEnabled: true,
                bevelSegments: 3,
                steps: 1,
                bevelSize: 0.05,
                bevelThickness: 0.05
            };

            const geo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
            geo.center();
            return geo;
        }

        const heartGeo = createHeartGeometry();
        const heartMat = new THREE.MeshStandardMaterial({
            color: 0xff1493,
            emissive: 0xff69b4,
            emissiveIntensity: 0.6,
            roughness: 0.2,
            metalness: 0.3
        });

        function spawnHeart(x, y, z) {
            const mesh = new THREE.Mesh(heartGeo, heartMat);
            mesh.position.set(x, y, z);
            
            const scale = Math.random() * 0.4 + 0.3;
            mesh.scale.set(scale, scale, scale);

            mesh.rotation.x = Math.PI;
            mesh.rotation.y = Math.random() * Math.PI * 2;

            heartsGroup.add(mesh);

            activeHearts.push({
                mesh: mesh,
                velocityY: Math.random() * 0.06 + 0.04,
                velocityX: (Math.random() - 0.5) * 0.03,
                velocityZ: (Math.random() - 0.5) * 0.03,
                rotSpeed: (Math.random() - 0.5) * 0.04,
                life: 1.0
            });
        }

        function triggerHeartBurst() {
            for (let i = 0; i < 35; i++) {
                const px = (Math.random() - 0.5) * 10;
                const py = (Math.random() - 0.5) * 4 - 2;
                const pz = (Math.random() - 0.5) * 10;
                spawnHeart(px, py, pz);
            }
        }

        document.getElementById('burst-hearts-btn').addEventListener('click', triggerHeartBurst);

        // Raycaster for tap/click anywhere
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('pointerdown', (e) => {
            if (e.target.closest('.pointer-events-auto')) return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            const point = new THREE.Vector3();
            raycaster.ray.at(15, point);
            
            for (let i = 0; i < 5; i++) {
                spawnHeart(
                    point.x + (Math.random() - 0.5) * 2,
                    point.y + (Math.random() - 0.5) * 2,
                    point.z + (Math.random() - 0.5) * 2
                );
            }
        });


        /* =========================================================================
           7. ANIMATION LOOP
           ========================================================================= */
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            // 1. Controls Update
            controls.update();

            // 2. Tulips Floating Movement
            tulipsData.forEach((item, idx) => {
                item.mesh.position.y = item.baseY + Math.sin(elapsedTime * 1.5 + item.phase) * 0.25;
                item.mesh.rotation.y += item.rotSpeed;
                item.mesh.rotation.z += Math.cos(elapsedTime + idx) * 0.001;
            });

            // 3. Rotate Star Field
            starField.rotation.y = elapsedTime * 0.02;

            // 4. Update Meteors
            for (let i = meteors.length - 1; i >= 0; i--) {
                const m = meteors[i];
                m.pos.add(m.vel);
                m.life -= 0.02;

                const positions = m.line.geometry.attributes.position.array;
                positions[0] = m.pos.x;
                positions[1] = m.pos.y;
                positions[2] = m.pos.z;
                positions[3] = m.pos.x - m.vel.x * 5;
                positions[4] = m.pos.y - m.vel.y * 5;
                positions[5] = m.pos.z - m.vel.z * 5;
                m.line.geometry.attributes.position.needsUpdate = true;

                if (m.life <= 0) {
                    scene.remove(m.line);
                    m.line.geometry.dispose();
                    meteors.splice(i, 1);
                }
            }

            // 5. Active Hearts Physics
            for (let i = activeHearts.length - 1; i >= 0; i--) {
                const h = activeHearts[i];
                h.mesh.position.y += h.velocityY;
                h.mesh.position.x += h.velocityX;
                h.mesh.position.z += h.velocityZ;
                h.mesh.rotation.y += h.rotSpeed;

                h.life -= 0.008;
                h.mesh.scale.multiplyScalar(0.992);

                if (h.life <= 0 || h.mesh.scale.x < 0.05) {
                    heartsGroup.remove(h.mesh);
                    h.mesh.geometry.dispose();
                    activeHearts.splice(i, 1);
                }
            }

            // 6. Render
            renderer.render(scene, camera);
        }

        // Handle Responsive Window Resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start loop on load
        window.onload = function() {
            animate();
        };

    </script>
</body>
</html>
